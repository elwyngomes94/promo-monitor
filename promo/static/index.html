<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Monitor</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1da;
  --accent:#0f6b4f; --accent-soft:#e1f1ea; --warn:#a2470e; --warn-soft:#fbe9dc;
  --bad:#a12a2a; --bad-soft:#f8e1e1; --flash:#7a4fd6; --flash-soft:#ece5fb; --chip:#efede7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131412; --panel:#1c1d1a; --ink:#ecebe6; --muted:#9a998f; --line:#2e2f2a;
    --accent:#4fc196; --accent-soft:#163428; --warn:#e59a5c; --warn-soft:#3a2516;
    --bad:#ec7b7b; --bad-soft:#3a1c1c; --flash:#b39bf2; --flash-soft:#2a2340; --chip:#262723; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
main{padding:0 24px 40px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.stores{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip .dot.ok{background:#3aa676}.chip .dot.erro{background:#d14b4b}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.filters input[type=search],.filters select,.filters input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
.filters input[type=search]{min-width:220px;flex:1}
.filters label{font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:var(--chip)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--chip)}
.prod{display:flex;gap:10px;align-items:flex-start;min-width:0}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--chip);flex:none;border:1px solid var(--line)}
.thumb.lg{width:96px;height:96px}
.thumb.sm{width:40px;height:40px}
.rank{font-weight:700;color:var(--muted);width:36px}
.title{font-weight:500}
.meta{color:var(--muted);font-size:12px}
.strike{text-decoration:line-through;color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;white-space:nowrap}
.b-real{background:var(--accent-soft);color:var(--accent)}
.b-min{background:var(--accent-soft);color:var(--accent)}
.b-fake,.b-raise{background:var(--bad-soft);color:var(--bad)}
.b-flash{background:var(--flash-soft);color:var(--flash)}
.b-ship,.b-cup{background:var(--chip);color:var(--ink)}
.pos{color:var(--accent);font-weight:600}.neg{color:var(--bad)}
.cheaper{color:var(--warn);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
.row:first-of-type{border-top:0}
.row.best{font-weight:600;color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(760px,94vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-body{padding:14px 16px}
svg text{fill:var(--muted);font-size:11px}
a{color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:16px}
@media (max-width:760px){ header,main{padding-left:14px;padding-right:14px} .hide-sm{display:none} }
</style>
</head>
<body>
<header>
  <h1>Promo<span>Monitor</span></h1>
  <div class="sub" id="updated">carregando…</div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <div class="stores" id="stores" aria-label="Lojas"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Buscar produto…">
    <select id="category"><option value="">Todas as categorias</option></select>
    <label><input type="checkbox" id="only_real"> Só desconto real</label>
    <label><input type="checkbox" id="free_shipping"> Frete grátis</label>
    <label><input type="checkbox" id="lightning"> Relâmpago</label>
    <label>Até R$ <input type="number" id="max_price" min="0" step="10" style="width:90px"></label>
    <a class="btn primary" id="csv" href="#">Exportar relatório (CSV)</a>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="ranking" aria-selected="true">Melhores promoções</button>
    <button class="tab" role="tab" data-tab="compare" aria-selected="false">Comparar lojas</button>
    <button class="tab" role="tab" data-tab="report" aria-selected="false">Relatório por loja</button>
  </nav>
  <section id="view"></section>
  <p class="note">Desconto real = queda frente à mediana dos últimos 90 dias (excluindo os 3 mais recentes). “Desconto maquiado” = loja anuncia ≥15% mas o preço não caiu de fato. Preço final = preço − cupom + frete.</p>
</main>

<dialog id="detail"><div class="dlg-head"><div class="prod"><span id="d-img"></span><div><div class="title" id="d-title"></div><div class="meta" id="d-meta"></div></div></div><button class="btn" onclick="detail.close()">Fechar</button></div><div class="dlg-body" id="d-body"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const brl = v => v == null ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct = v => v == null ? '—' : (v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STORES = [], selected = new Set(), tab = 'ranking';
try { const s = JSON.parse(localStorage.getItem('pm_stores')||'[]'); s.forEach(x=>selected.add(x)); tab = localStorage.getItem('pm_tab') || tab; } catch(e) {}

const FLAG = {
  desconto_real:['b-real','Desconto real'], menor_preco_historico:['b-min','Menor preço 90d'],
  desconto_maquiado:['b-fake','Desconto maquiado'], aumentou_antes:['b-raise','Subiu antes'],
  relampago:['b-flash','Relâmpago'], frete_gratis:['b-ship','Frete grátis'], cupom:['b-cup','Cupom']
};
const thumb = (src, cls='') => src ? `<img class="thumb ${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : `<span class="thumb ${cls}"></span>`;
const badges = f => f.map(x => FLAG[x] ? `<span class="badge ${FLAG[x][0]}">${FLAG[x][1]}</span>` : '').join('');

function params(extra={}) {
  const p = new URLSearchParams();
  if (selected.size) p.set('store', [...selected].join(','));
  if ($('#q').value) p.set('q', $('#q').value);
  if ($('#category').value) p.set('category', $('#category').value);
  for (const k of ['only_real','free_shipping','lightning']) if ($('#'+k).checked) p.set(k,'1');
  if ($('#max_price').value) p.set('max_price', $('#max_price').value);
  for (const [k,v] of Object.entries(extra)) p.set(k,v);
  return p.toString();
}
const api = (path, extra) => fetch(`/api/${path}?${params(extra)}`).then(r => r.json());

async function init() {
  STORES = await fetch('/api/stores').then(r=>r.json());
  const cats = await fetch('/api/categories').then(r=>r.json());
  $('#category').innerHTML += cats.map(c=>`<option>${esc(c)}</option>`).join('');
  renderStores();
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; try{localStorage.setItem('pm_tab',tab)}catch(e){}; refresh(); });
  ['q','category','only_real','free_shipping','lightning','max_price'].forEach(id => $('#'+id).addEventListener('input', debounce(refresh, 250)));
  refresh();
}
function debounce(fn, ms){ let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

function renderStores() {
  $('#stores').innerHTML = `<button class="chip" aria-pressed="${selected.size===0}" data-id="">Todas</button>` +
    STORES.map(s => `<button class="chip" aria-pressed="${selected.has(s.id)}" data-id="${s.id}" title="${esc(s.source_note)}${s.last_run ? ' — última coleta: '+s.last_run.status : ''}">
      <span class="dot ${s.last_run ? s.last_run.status : ''}"></span>${esc(s.name)}</button>`).join('');
  $('#stores').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const id = c.dataset.id;
    if (!id) selected.clear(); else selected.has(id) ? selected.delete(id) : selected.add(id);
    try{localStorage.setItem('pm_stores', JSON.stringify([...selected]))}catch(e){}
    renderStores(); refresh();
  });
}

async function refresh() {
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#csv').href = `/api/report.csv?${params()}`;
  const sum = await api('summary');
  $('#updated').textContent = `${sum.total_offers} ofertas analisadas · atualizado ${new Date(sum.generated_at).toLocaleString('pt-BR')}`;
  $('#kpis').innerHTML = [
    [sum.total_offers,'ofertas monitoradas'], [sum.real_discounts,'com desconto real'],
    [sum.lightning,'ofertas relâmpago'], [sum.fake_discounts,'descontos maquiados evitados']
  ].map(([v,l])=>`<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('');
  if (tab === 'ranking') return renderRanking();
  if (tab === 'compare') return renderCompare();
  renderReport(sum);
}

async function renderRanking() {
  const rows = await api('ranking', {limit: 60});
  if (!rows.length) return $('#view').innerHTML = '<div class="empty">Nenhuma oferta com esses filtros.</div>';
  $('#view').innerHTML = `<table><thead><tr><th>#</th><th>Produto</th><th>Loja</th><th class="num">Preço final</th><th class="num hide-sm">Referência 90d</th><th class="num">Desc. real</th><th class="hide-sm">Vendedor</th><th></th></tr></thead><tbody>` +
    rows.map(r => `<tr class="clickable" data-id="${r.listing_id}">
      <td class="rank">${r.rank}</td>
      <td><div class="prod">${thumb(r.image)}<div><div class="title">${esc(r.title)}</div>${badges(r.flags)}
        ${r.cheaper_elsewhere ? `<div class="cheaper">Mais barato em ${esc(r.cheaper_elsewhere.store_name)}: ${brl(r.cheaper_elsewhere.effective_price)}</div>`:''}</div></div></td>
      <td>${esc(r.store_name)}<div class="meta">${r.stores_compared} loja(s) comparada(s)</div></td>
      <td class="num"><b>${brl(r.effective_price)}</b>${r.list_price && r.list_price > r.price ? `<div class="strike">${brl(r.list_price)}</div>`:''}
        ${r.coupon_code ? `<div class="meta">cupom ${esc(r.coupon_code)} −${brl(r.coupon_value)}</div>`:''}
        ${!r.free_shipping && r.shipping_cost ? `<div class="meta">${brl(r.price)} + frete ${brl(r.shipping_cost)}</div>`:''}</td>
      <td class="num hide-sm">${brl(r.reference_price)}</td>
      <td class="num ${r.real_discount > 0.0999 ? 'pos' : r.real_discount < 0 ? 'neg':''}">${pct(r.real_discount)}<div class="meta">anunc. ${pct(r.announced_discount)}</div></td>
      <td class="hide-sm">${esc(r.seller_name || '—')}<div class="meta">${esc(r.seller_reputation || '')}</div></td>
      <td><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Comprar</a></td></tr>`).join('') + '</tbody></table>';
  $('#view').querySelectorAll('tr.clickable').forEach(tr => tr.onclick = () => openDetail(+tr.dataset.id));
}

async function renderCompare() {
  const groups = await api('compare');
  const q = $('#q').value.toLowerCase();
  const list = groups.filter(g => !q || g.name.toLowerCase().includes(q));
  if (!list.length) return $('#view').innerHTML = '<div class="empty">Nenhum produto encontrado em mais de uma loja.</div>';
  $('#view').innerHTML = `<div class="cards">` + list.map(g => `<div class="card"><div class="prod">${thumb(g.offers[0].image)}<div><h3>${esc(g.name)}</h3>
    <div class="meta">${g.stores.length} lojas · diferença de ${brl(g.spread)} entre o mais barato e o mais caro</div></div></div>` +
    g.offers.map((o,i) => `<div class="row ${i===0?'best':''}"><span>${esc(o.store_name)}${o.seller_name ? ` <span class="meta">· ${esc(o.seller_name)}</span>`:''}${o.free_shipping?' <span class="badge b-ship">frete grátis</span>':''}</span>
      <span><a href="${esc(o.url)}" target="_blank" rel="noopener">${brl(o.effective_price)}</a></span></div>`).join('') + '</div>').join('') + '</div>';
}

function renderReport(sum) {
  $('#view').innerHTML = `<table><thead><tr><th>Loja</th><th class="num">Ofertas</th><th class="num">Desconto real</th><th class="num">Média desc. real</th><th class="num">Relâmpago</th><th class="num">Frete grátis</th><th class="num">Maquiados</th><th class="hide-sm">Fonte de dados</th><th class="hide-sm">Última coleta</th></tr></thead><tbody>` +
    sum.stores.map(s => { const st = STORES.find(x=>x.id===s.store_id) || {}; const lr = st.last_run;
      return `<tr><td><b>${esc(s.store_name)}</b></td><td class="num">${s.offers}</td><td class="num">${s.real_discounts}</td><td class="num">${pct(s.avg_real_discount)}</td>
      <td class="num">${s.lightning}</td><td class="num">${s.free_shipping}</td><td class="num">${s.fake_discounts}</td>
      <td class="hide-sm meta">${st.source === 'official_api' ? 'API oficial' : 'Feed de afiliados'}</td>
      <td class="hide-sm meta">${lr ? `${esc(lr.status)} · ${new Date(lr.started_at).toLocaleString('pt-BR')}${lr.error ? ' · '+esc(lr.error):''}` : 'dados de demonstração'}</td></tr>`; }).join('') + '</tbody></table>';
}

async function openDetail(id) {
  const [h, offers] = await Promise.all([fetch(`/api/history?listing_id=${id}`).then(r=>r.json()), api('offers')]);
  const me = offers.find(o => o.listing_id === id) || {};
  $('#d-title').textContent = h.listing.title;
  $('#d-img').innerHTML = thumb(h.listing.image, 'lg');
  $('#d-meta').textContent = `${me.store_name || ''} · ${h.history.length} registros de preço`;
  let others = '';
  if (me.group_id) {
    const g = await fetch(`/api/compare?group_id=${me.group_id}`).then(r=>r.json());
    if (g.offers) others = `<h4>Mesmo produto em outras lojas e vendedores</h4>` + g.offers.map((o,i)=>`<div class="row ${i===0?'best':''}"><span>${esc(o.store_name)} <span class="meta">${esc(o.seller_name||'')} ${esc(o.seller_reputation||'')}</span></span><span><a href="${esc(o.url)}" target="_blank" rel="noopener">${brl(o.effective_price)}</a></span></div>`).join('');
  }
  $('#d-body').innerHTML = chart(h.history) +
    `<p>${badges(me.flags||[])}</p><p>Preço atual <b>${brl(me.price)}</b> · final <b>${brl(me.effective_price)}</b> · referência ${brl(me.reference_price)} · mínimo 90d ${brl(me.min_price_90d)}</p>
     <p><a class="btn primary" href="${esc(h.listing.url)}" target="_blank" rel="noopener">Abrir na loja</a></p>` + others;
  $('#detail').showModal();
}

function chart(hist) {
  if (hist.length < 2) return '<div class="empty">Histórico insuficiente.</div>';
  const W=700,H=180,P=36, ps = hist.map(h=>h.price), lo=Math.min(...ps)*0.95, hi=Math.max(...ps)*1.05;
  const x = i => P + i*(W-P-8)/(hist.length-1), y = v => H-22 - (v-lo)/(hi-lo)*(H-34);
  const path = hist.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(h.price).toFixed(1)}`).join('');
  const last = hist[hist.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Histórico de preço">
    <line x1="${P}" x2="${W-8}" y1="${y(lo/0.95)}" y2="${y(lo/0.95)}" stroke="var(--line)"/>
    <line x1="${P}" x2="${W-8}" y1="${y(hi/1.05)}" y2="${y(hi/1.05)}" stroke="var(--line)"/>
    <text x="0" y="${y(hi/1.05)+4}">${Math.round(hi/1.05)}</text><text x="0" y="${y(lo/0.95)+4}">${Math.round(lo/0.95)}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(hist.length-1)}" cy="${y(last.price)}" r="4" fill="var(--accent)"/>
    <text x="${P}" y="${H-4}">${new Date(hist[0].collected_at).toLocaleDateString('pt-BR')}</text>
    <text x="${W-8}" y="${H-4}" text-anchor="end">${new Date(last.collected_at).toLocaleDateString('pt-BR')}</text></svg>`;
}
init();
</script>
</body>
</html>
